x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "25m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
        - NEXT_PUBLIC_WS_URL=/hubs
    container_name: ${COMPOSE_PROJECT_NAME:-smartcustomercore}-frontend
    restart: unless-stopped
    logging: *log-rotation
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_started
    networks:
      - smartcore-net

  backend:
    logging: *log-rotation
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Advertising__Enabled: "${ADVERTISING_ENABLED:-true}"
      Advertising__AllowRealActivation: "${ADVERTISING_ALLOW_REAL_ACTIVATION:-false}"
      YOUTUBE_OAUTH_REDIRECT_URI: "${YOUTUBE_OAUTH_REDIRECT_URI:-https://n8n-mazen.online/api/quran/youtube/callback}"
      ZERNIO_API_KEY: "${ZERNIO_API_KEY:-}"
      ZERNIO_PROFILE_ID: "${ZERNIO_PROFILE_ID:-}"
      ZERNIO_TIKTOK_ACCOUNT_ID: "${ZERNIO_TIKTOK_ACCOUNT_ID:-}"

  postgres:
    logging: *log-rotation

  redis:
    logging: *log-rotation

  rabbitmq:
    logging: *log-rotation

  minio:
    logging: *log-rotation

  elasticsearch:
    logging: *log-rotation

  whatsapp-gateway:
    logging: *log-rotation

  nginx:
    logging: *log-rotation
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      frontend:
        condition: service_started
