name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Stage and deploy release
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          STAGED_DIR="/root/smart-crm-releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$SSH_HOST" "mkdir -p '$STAGED_DIR'"
          sshpass -e rsync -az -e "ssh -o StrictHostKeyChecking=accept-new" \
            --exclude-from=ops/deploy-excludes.txt ./ "root@$SSH_HOST:$STAGED_DIR/"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "root@$SSH_HOST" \
            "bash '$STAGED_DIR/ops/deploy-remote.sh' '$GITHUB_SHA' '$STAGED_DIR' /root/smart-crm && rm -rf -- '$STAGED_DIR'"
